# Smoke test config — small universe for fast verification

universe:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - META
    - NVDA
    - JPM
    - JNJ
    - V
    - PG
    - XOM
    - BAC
    - PFE
    - HD
    - DIS
    - WMT
    - CSCO
    - NFLX
    - PEP
    - KO
  benchmark: SPY
  start_date: "2018-01-01"
  end_date: "2024-12-31"

data:
  parquet_dir: "data/parquet"
  raw_dir: "data/raw"

features:
  momentum_windows: [21, 63, 126]
  volatility_windows: [20, 60]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  volume_zscore_window: 20
  beta_window: 60
  skew_window: 60
  kurt_window: 60
  autocorr_lags: [5, 20]
  sma_windows: [20, 50]
  bollinger_window: 20
  bollinger_std: 2.0
  obv_slope_window: 20
  vol_of_vol_window: 60
  feature_lag: 1

target:
  horizon: 5
  label: "fwd_log_ret_5d"

model:
  types: ["lightgbm"]
  primary: "lightgbm"
  lightgbm:
    n_estimators: 200
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
    verbose: -1

walk_forward:
  min_train_days: 504
  rebalance_every: 21
  embargo_days: 5

portfolio:
  long_percentile: 80
  short_percentile: 20
  weighting: "equal"
  max_position_weight: 0.10
  volatility_target: 0.12
  vol_lookback: 63
  max_turnover: 0.60

costs:
  commission_bps: 2.0
  slippage_vol_multiplier: 0.10
  spread_bps: 1.0

risk:
  max_drawdown_threshold: 0.25
  n_regimes: 3
  regime_vol_window: 60

output:
  results_dir: "output/results"
  plots_dir: "output/plots"

logging:
  level: "INFO"
  file: "output/alpha_engine.log"
